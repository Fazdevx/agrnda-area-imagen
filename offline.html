<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#3b82f6">
  <title>Sin conexión · TareasApp</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg-app, #f7f6f3);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: var(--text-main, #1f1f1f);
    }
    body.dark {
      --bg-app: #191919;
      --text-main: #efefef;
    }
    .container {
      text-align: center;
      max-width: 420px;
      padding: 2rem;
    }
    .icon {
      width: 80px; height: 80px; margin: 0 auto 1.5rem;
    }
    .icon circle, .icon path { stroke: #3b82f6; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    body.dark .icon circle, body.dark .icon path { stroke: #60a5fa; }
    h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 0.75rem; }
    p { font-size: 0.95rem; color: #6b6b6b; line-height: 1.6; }
    body.dark p { color: #a0a0a0; }
    .retry-btn {
      margin-top: 1.5rem; padding: 0.6rem 1.2rem; border-radius: 8px;
      background: #3b82f6; color: white; border: none; font-size: 0.9rem;
      cursor: pointer; transition: opacity 0.2s;
    }
    .retry-btn:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="container">
    <!-- Icono simple: nube con rayo (sin conexión) -->
    <svg class="icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M20.35 11A4.5 4.5 0 0 0 12 6.5a4.45 4.45 0 0 0-.69.06A4 4 0 0 0 7 11h-.5A3.5 3.5 0 0 0 7 17.5H17a3.5 3.5 0 0 0 3.35-4.5Z"/>
      <path d="M12 11V3m3 3l-3-3-3 3"/>
      <circle cx="12" cy="15" r="1.5" fill="#3b82f6"/>
    </svg>
    <h1>Modo sin conexión</h1>
    <p>No puedes acceder a Internet en este momento. Tus datos se guardan localmente y estarán disponibles cuando te vuelvas a conectar.</p>
    <button class="retry-btn" onclick="window.location.reload()">Reintentar</button>
  </div>
</body>
</html>
